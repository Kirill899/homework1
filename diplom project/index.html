<!DOCTYPE html>
<html class="page" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/index.css">
  <title>Dayson</title>
  <script defer src="./js/index.js" type="module" ></script>
</head>
<body class="page__body">
     <header class="header">
           <div class="container header__container">
             <button class=" header__burger burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
              <svg width="40" height="40">
                <use class="burger__icon-menu" href="./icons/Frame19.svg#menu-burger"></use>
              </svg>
            </button>
            <a class="logo header__logo" href="#">
              <img 
              class="logo__img" 
              src="./icons/logoheader.svg" 
              width="183"
              height="77"
              alt="Логотип Dayson"
              />
             </a>
             <nav class="menu header__menu" id="header__menu" aria-label="Главное меню" >
                 <ul class="menu__list">
                  <li class="menu__item">
                    <a class="menu__link" href="#about-us">О нас</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#delivering">Доставка и оплата</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#register">Регистрация продукта</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#service">Сервис</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#certificat">Сертификаты и лицензии</a>
                  </li>
                 </ul>
             </nav>
             <div class="header__action">
              <button
              class="header__actions-button"
              title="Корзина"
              aria-label="Корзина"
              >
              <svg width="36" height="36">
                <use
                  class="header__actions-icon"
                  href="./icons/hedercorz.svg#cart"
                ></use>
              </svg>
            </button>
            
             </div>
           </div>
     </header>
     <main class="main">
      <section class="hero">
         <div class="container hero__container">
             <div class="hero__block-text">
              <h1 class="hero__title"> <span class="hero__title-top">Уникальные технологии</span> <span class="hero__title-top"> для ухода за волосами </span></h1>
              <p class="hero__text">Идеальная укладка для всех типов волос вместе с Dyson
              </p>
              <a class="hero__button button" href="#">Подробнее</a>
             </div>
               <picture class="hero__img-picture">
              <img class="hero__img" width="972" height="850" src="./images/hero-img.png" alt="Девушка с феном dayson в руках">
             </picture>
         </div>
       
      </section>
     </main>
</body>
</html>
