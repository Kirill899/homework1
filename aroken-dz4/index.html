<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <form class="form">
  <fieldset class="fieldset-body">
    <h3 class="form-title">Ваши личные данные</h3>
    <label class="label-body">
      <span>Ваше имя</span>
      <input class="form-input" type="name" id="name" placeholder="Имя" required>
    </label>
    <label class="label-body">
     <span>Ваш возраст</span>
    
      <input class="form-input" type="number" id="number" placeholder="Возраст" required>
    </label>
    <label class="label-body">
      <span>Ваш номер телефона</span>
      <input class="form-input"  type="tel" id="tel" placeholder="Номер телефона" required>
    </label>
    <label class="label-body">
      <span>Ваша почта</span>
      <input class="form-input"  type="email" id="email" placeholder="Почта" required>
    </label>
     <label class="label-check" >
      <span>Сообщение</span>
      <textarea name="message" placeholder="Ваше сообщение" id=""></textarea>
     </label>
    <label class="label-check">
      <input class="form-input1" type="checkbox">
      Я принимаю правила
    </label>
     <button type="submit" class="form-but"><span class="span-but">Отправить</span></button>
  </fieldset>


 </form>
</body>
</html>
